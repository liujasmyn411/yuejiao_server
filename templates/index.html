<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>粤教服务 AI Agent</title>
  <link rel="stylesheet" href="/static/css/app.css">
</head>
<body>
  <div id="app">
    <aside id="sidebar" class="sidebar"></aside>
    <div class="main-area">
      <header id="topbar" class="topbar"></header>
      <main id="content" class="content"></main>
    </div>
    <div id="chat-widget" class="chat-widget hidden">
      <div class="chat-widget__header">
        <span id="chat-title">AI 助手</span>
        <div class="chat-widget__actions">
          <button id="chat-minimize" class="btn-icon">─</button>
          <button id="chat-close" class="btn-icon">✕</button>
        </div>
      </div>
      <div id="chat-messages" class="chat-widget__messages"></div>
      <div class="chat-widget__input">
        <textarea id="chat-input" rows="1" placeholder="输入消息..."></textarea>
        <button id="chat-send" class="btn btn-primary btn-sm">发送</button>
      </div>
    </div>
    <button id="chat-toggle" class="chat-toggle btn btn-primary">💬 AI助手</button>
  </div>
  <div id="toast-container" class="toast-container"></div>

  <!-- JS: 核心 -->
  <script src="/static/js/api.js"></script>
  <script src="/static/js/router.js"></script>
  <!-- JS: 组件 -->
  <script src="/static/js/components/sidebar.js"></script>
  <script src="/static/js/components/topbar.js"></script>
  <script src="/static/js/components/toast.js"></script>
  <script src="/static/js/components/modal.js"></script>
  <script src="/static/js/components/chat.js"></script>
  <!-- JS: 页面 -->
  <script src="/static/js/pages/login.js"></script>
  <script src="/static/js/pages/dashboard.js"></script>
  <script src="/static/js/pages/leads.js"></script>
  <script src="/static/js/pages/academic.js"></script>
  <script src="/static/js/pages/events.js"></script>
  <script src="/static/js/pages/projects.js"></script>
  <script src="/static/js/pages/profileMatch.js"></script>
  <script src="/static/js/pages/parseFile.js"></script>
  <script src="/static/js/pages/reports.js"></script>
  <script src="/static/js/pages/scores.js"></script>
  <script src="/static/js/pages/employees.js"></script>
  <script src="/static/js/pages/approvals.js"></script>
  <script src="/static/js/pages/orgChart.js"></script>
  <script src="/static/js/pages/studyAbroad.js"></script>
  <script src="/static/js/pages/leave.js"></script>
  <script src="/static/js/pages/feedback.js"></script>
  <script src="/static/js/pages/notifications.js"></script>
  <script src="/static/js/pages/psychAlerts.js"></script>
  <script src="/static/js/pages/reportsCenter.js"></script>
  <script src="/static/js/pages/studentInfo.js"></script>
  <script src="/static/js/pages/nl2sql.js"></script>
  <!-- JS: 入口 -->
  <script src="/static/js/app.js"></script>
</body>
</html>
